# Scheduled alert: fires when one source IP records 5+ failed SSH passwords in 15 minutes.
# Maps to MITRE ATT&CK T1110.001 (Brute Force: Password Guessing).

[SSH Brute-Force Attempt Detected]
search = index=ssh_bruteforce "Failed password" | stats count by src_ip, host | where count >= 5
dispatch.earliest_time = -15m
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
counttype = number of events
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.severity = 4
alert.track = 1
alert.suppress = 1
alert.suppress.period = 15m
description = Fires when a single source IP records 5 or more failed SSH passwords within 15 minutes.
