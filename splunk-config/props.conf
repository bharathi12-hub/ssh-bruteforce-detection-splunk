# Search-time field extractions for sshd authentication events (sourcetype=syslog).
# Surfaces user, src_ip, and src_port so detections can group/threshold by source.

[syslog]
EXTRACT-ssh_failed_password = Failed password for (?:invalid user )?(?<user>\S+) from (?<src_ip>\d{1,3}(?:\.\d{1,3}){3})(?: port (?<src_port>\d+))?
EXTRACT-ssh_invalid_user = Invalid user (?<user>\S+) from (?<src_ip>\d{1,3}(?:\.\d{1,3}){3})
EXTRACT-ssh_accepted = Accepted password for (?<user>\S+) from (?<src_ip>\d{1,3}(?:\.\d{1,3}){3})(?: port (?<src_port>\d+))?
